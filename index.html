<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Khata is a calm, private expense tracker for India and Nepal. Reads bank and wallet SMS, works offline, no account needed." />
    <meta name="theme-color" content="#f6f1ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#130d0b" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Khata" />
    <meta name="application-name" content="Khata" />
    <meta name="author" content="Chocolate Wafer" />
    <meta name="keywords" content="expense tracker, budget app, money manager, India, Nepal, eSewa, Khalti, UPI, bank SMS, offline, PWA" />
    <link rel="canonical" href="%SITE_URL%" />

    <!-- link previews (WhatsApp, Facebook, LinkedIn, Slack, Discord, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Khata" />
    <meta property="og:title" content="Khata — expense tracker for India and Nepal" />
    <meta property="og:description" content="Log a purchase in two taps. Reads bank and wallet SMS. Private, offline, no account — everything stays on your phone." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%social-card.png" />
    <meta property="og:image:secure_url" content="%SITE_URL%social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Khata logo, a coffee cup, with the tagline: expense tracker for India and Nepal" />
    <meta property="og:locale" content="en_IN" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Khata — expense tracker for India and Nepal" />
    <meta name="twitter:description" content="Log a purchase in two taps. Reads bank and wallet SMS. Private, offline, no account." />
    <meta name="twitter:image" content="%SITE_URL%social-card.png" />
    <meta name="twitter:image:alt" content="Khata logo, a coffee cup, with the tagline: expense tracker for India and Nepal" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Khata — expense tracker for India and Nepal</title>
    <script>
      // apply the saved theme before first paint so there is no flash
      try {
        var t = JSON.parse(localStorage.getItem('khata-settings') || '{}').theme;
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
